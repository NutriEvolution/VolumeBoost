name: Pubblica APK

# Parte da solo quando cambia il file VERSION su main, oppure a mano da "Actions > Run workflow"
on:
  push:
    branches: [main]
    paths: ["VERSION"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"

      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Mancano i secret (Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compila
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # Stessa chiave di TrainUP (alias "ripresa"); per una chiave diversa crea il secret KEY_ALIAS
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ripresa' }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          gradle assembleRelease -PversionName="$V" --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "VolumeBoost-$V.apk"

      - name: Controlla la firma dell'APK
        env:
          # Impronta della chiave di TrainUP; per una chiave diversa crea la variabile FIRMA_SHA256
          ATTESA: ${{ vars.FIRMA_SHA256 || '73350dccf8df063cd7b2a1005ce7ee65c35fa923b12f19483caad4466e58f7ff' }}
        run: |
          AS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          TROVATA=$("$AS" verify --print-certs "VolumeBoost-$VERSION.apk" | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          echo "Firma: $TROVATA"
          if [ "$TROVATA" != "$(echo "$ATTESA" | tr 'A-F' 'a-f')" ]; then echo "::error::L'APK non e' firmato con la chiave attesa"; exit 1; fi

      - name: Pubblica la release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Volume Boost ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: VolumeBoost-${{ env.VERSION }}.apk
          body_path: NOVITA.md
